<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <!-- Concept 2: The Chat-Wave gradient: Blue -> Purple -> Coral/Orange -->
    <linearGradient id="chatWaveGrad" x1="40" y1="35" x2="235" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00A6FF"/>
      <stop offset="28%" stop-color="#2B70F7"/>
      <stop offset="56%" stop-color="#7A38F7"/>
      <stop offset="80%" stop-color="#B925E8"/>
      <stop offset="100%" stop-color="#FF5B37"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Outer Chat-Wave Body: Right-pointing play triangle + bottom-left chat bubble tail -->
  <g filter="url(#subtleGlow)">
    <path d="
      M 78 36
      C 52 36 36 54 36 86
      L 36 172
      C 36 190 41 204 48 217
      L 41 243
      C 39 249 44 254 50 251
      L 76 237
      C 82 234 88 234 94 236
      C 122 243 166 213 200 183
      C 224 159 236 142 236 126
      C 236 110 224 93 200 69
      C 164 37 118 36 78 36
      Z"
      fill="url(#chatWaveGrad)"
    />
  </g>

  <!-- Waveform (White audio/video wave + sparkle star on right) -->
  <g fill="#FFFFFF">
    <!-- 1. Leftmost small circle dot -->
    <circle cx="75" cy="126" r="7"/>

    <!-- 2. Left vertical rounded capsule bar -->
    <rect x="97" y="102" width="13" height="48" rx="6.5"/>

    <!-- 3. Center tallest vertical rounded capsule bar -->
    <rect x="125" y="74" width="16" height="104" rx="8"/>

    <!-- 4. Right vertical rounded capsule bar -->
    <rect x="156" y="102" width="13" height="48" rx="6.5"/>

    <!-- 5. Right circle dot + 4-pointed sparkle star -->
    <!-- Starburst glint cross -->
    <path d="
      M 190 102
      Q 190 126 166 126
      Q 190 126 190 150
      Q 190 126 214 126
      Q 190 126 190 102
      Z"
      opacity="0.75"
    />
    <!-- Subtle diagonal sparkle glints -->
    <line x1="178" y1="114" x2="202" y2="138" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
    <line x1="178" y1="138" x2="202" y2="114" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
    <!-- Center white circle -->
    <circle cx="190" cy="126" r="6.5"/>
  </g>
</svg>