<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YtGenius — Ask your videos anything</title>
    <meta name="description" content="Ask questions about any YouTube video and get instant, timestamped answers with YtGenius." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="alternate icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/logo.png?v=2" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Enforce Dark Theme Only before React mounts.
      document.documentElement.setAttribute('data-theme', 'dark');
      try {
        localStorage.setItem('ytgenius_theme', 'dark');
        localStorage.setItem('vidmind_theme', 'dark');
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
